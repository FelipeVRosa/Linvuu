apply plugin: 'com.android.application'

// A assinatura abaixo é exclusiva do aplicativo de testes, nunca da produção.
def testKeystore = System.getenv('LINVUU_TEST_KEYSTORE')
def testPassword = System.getenv('LINVUU_TEST_PASSWORD')
def suppliedCode = System.getenv('ANDROID_VERSION_CODE')
def suppliedName = System.getenv('ANDROID_VERSION_NAME') ?: '0.1.local'
if ((testKeystore && !testPassword) || (!testKeystore && testPassword)) throw new GradleException('Configuração incompleta da assinatura de testes')
if (System.getenv('CI') == 'true' && (!testKeystore || !suppliedCode)) throw new GradleException('CI exige assinatura estável e versão identificável')
if (suppliedCode && (!(suppliedCode ==~ /[0-9]+/) || suppliedCode.toLong() < 1 || suppliedCode.toLong() > 2100000000)) throw new GradleException('ANDROID_VERSION_CODE inválido')
if (!(suppliedName ==~ /[0-9A-Za-z.+_-]{1,60}/)) throw new GradleException('ANDROID_VERSION_NAME inválido')

android {
    namespace = "com.linvuu.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.linvuu.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode suppliedCode ? suppliedCode.toInteger() : 1
        versionName suppliedName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        teste {
            if (testKeystore) {
                storeType 'PKCS12'
                storeFile file(testKeystore)
                storePassword testPassword
                keyAlias 'linvuu-test'
                keyPassword testPassword
            }
        }
    }
    buildTypes {
        debug {
            applicationIdSuffix '.teste'
            versionNameSuffix '-teste'
            resValue 'string', 'app_name', 'Linvuu Teste'
            if (testKeystore) signingConfig signingConfigs.teste
        }
        release {
            debuggable false
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

// A distribuição da loja permanece bloqueada até existir verificação de assinatura
// de produção e do manifesto final. A chave de testes nunca serve para release.
gradle.taskGraph.whenReady { graph ->
    if (graph.allTasks.any { it.project == project && it.name ==~ /(?i).*(assemble|bundle|package).*release.*/ }) {
        throw new GradleException('Release de loja bloqueada: configurar assinatura de produção e validar manifesto final antes de habilitar esta tarefa')
    }
}
