name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Dependências sem vulnerabilidade conhecida (produção)
        run: npm audit --omit=dev --audit-level=high
      - name: Teste de segurança do servidor (cabeçalhos, API fechada, limite de uso)
        run: npm run testar:seguranca
