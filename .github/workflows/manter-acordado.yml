name: Manter o site acordado

# No plano gratuito do Render o serviço hiberna depois de 15 minutos sem visita, e a primeira visita espera ~50 s.
# O robô do Google desiste antes disso («Não foi possível buscar o sitemap»). Este workflow visita o site a cada 10 minutos.
# Quando o serviço estiver num plano pago (sem hibernação), pode apagar este arquivo.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
permissions: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Visitar /healthz e o sitemap
        run: |
          curl -fsS --max-time 90 https://linvuu.com.br/healthz
          curl -fsS --max-time 60 -o /dev/null -w "sitemap: %{http_code} %{content_type}\n" https://linvuu.com.br/sitemap.xml
