<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Folha em branco · Linvuu</title>
  <link rel="stylesheet" href="../linvuu.css">
</head>
<body>
<main class="lv-folha">

  <header class="lv-cabecalho">
    <img class="lv-logo" src="../assets/linvuu-logo.png" alt="Linvuu">
    <span class="lv-eyebrow">[Título do material]</span>
  </header>

  <h1 class="lv-h1">[Título]</h1>
  <p class="lv-lead">[Subtítulo ou objetivo, em uma frase.]</p>

  <section class="lv-secao-folha">
    <h2 class="lv-h3">[Seção]</h2>
    <p>[Texto.]</p>
  </section>

  <section class="lv-secao-folha">
    <h2 class="lv-h3">[Seção]</h2>
    <p>[Texto.]</p>
  </section>

  <footer class="lv-rodape">
    <span>linvuu.com.br</span>
    <span>Material de estudo da Linvuu.</span>
  </footer>

</main>
</body>
</html>
