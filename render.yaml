# Blueprint do Render (opcional): descreve o serviço que já existe no painel. Para usar, Render → Blueprints → New → este repositório.
# Valores secretos ficam com `sync: false` (preenchidos no painel, nunca no GitHub).
services:
  - type: web
    name: linvuu
    runtime: node
    plan: starter            # o plano gratuito hiberna e a primeira visita espera ~50 s; para um site pago, use um plano sem hibernação
    region: virginia
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_URL
        value: https://linvuu.com.br
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PRICE_ID
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: VITE_FIREBASE_API_KEY
        sync: false
      - key: VITE_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: VITE_FIREBASE_PROJECT_ID
        sync: false
      - key: VITE_FIREBASE_APP_ID
        sync: false
      - key: VITE_FIREBASE_STORAGE_BUCKET
        sync: false
      - key: VITE_FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: VITE_AUTH_GOOGLE
        value: "false"
