name: Monitorar site e dependencias

# No plano gratuito do Render o serviço hiberna depois de 15 minutos sem visita, e a primeira visita espera ~50 s.
# Este workflow verifica processo, sitemap e dependencias. Agendamentos do GitHub podem atrasar;
# nao substitui instancia sem hibernacao ou monitoramento externo de disponibilidade.
on:
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'
  workflow_dispatch:
permissions: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verificar processo, sitemap e dependencias sem cobrancas
        run: |
          curl -fsS --max-time 90 https://linvuu.com.br/healthz
          curl -fsS --max-time 60 -o /dev/null -w "sitemap: %{http_code} %{content_type}\n" https://linvuu.com.br/sitemap.xml
          curl -fsS --max-time 90 --retry 1 --retry-delay 10 https://linvuu.com.br/readyz
