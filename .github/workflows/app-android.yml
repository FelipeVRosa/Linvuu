name: App Android (APK de teste)
on:
  workflow_dispatch:
  pull_request:
    paths: ['android/**', 'capacitor.config.ts', 'src/**', 'public/**', 'scripts/app-android.mjs', 'package*.json']
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - name: Gerar o site e sincronizar com o Android
        run: npm run app:android
      - name: Compilar o APK de depuração
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: linvuu-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 2
          if-no-files-found: error
