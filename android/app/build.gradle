apply plugin: 'com.android.application'

// A assinatura abaixo é exclusiva do aplicativo de testes, nunca da produção.
def testKeystore = System.getenv('LINVUU_TEST_KEYSTORE')
def testPassword = System.getenv('LINVUU_TEST_PASSWORD')
def suppliedCode = System.getenv('ANDROID_VERSION_CODE')
def suppliedName = System.getenv('ANDROID_VERSION_NAME') ?: '1.0.0'

// Assinatura de produção: arquivo local fora do Git (ver keystore.properties.example). A chave nunca entra no repositório.
def ksFile = rootProject.file('keystore.properties')
def ksProps = new Properties()
if (ksFile.exists()) ksFile.withInputStream { ksProps.load(it) }
def producaoConfigurada = ['storeFile', 'storePassword', 'keyAlias', 'keyPassword'].every { ksProps.getProperty(it) }
if ((testKeystore && !testPassword) || (!testKeystore && testPassword)) throw new GradleException('Configuração incompleta da assinatura de testes')
if (System.getenv('CI') == 'true' && (!testKeystore || !suppliedCode)) throw new GradleException('CI exige assinatura estável e versão identificável')
if (suppliedCode && (!(suppliedCode ==~ /[0-9]+/) || suppliedCode.toLong() < 1 || suppliedCode.toLong() > 2100000000)) throw new GradleException('ANDROID_VERSION_CODE inválido')
if (!(suppliedName ==~ /[0-9A-Za-z.+_-]{1,60}/)) throw new GradleException('ANDROID_VERSION_NAME inválido')

android {
    namespace = "com.linvuu.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.linvuu.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode suppliedCode ? suppliedCode.toInteger() : 1
        versionName suppliedName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        producao {
            if (producaoConfigurada) {
                storeFile rootProject.file(ksProps.getProperty('storeFile'))
                storePassword ksProps.getProperty('storePassword')
                keyAlias ksProps.getProperty('keyAlias')
                keyPassword ksProps.getProperty('keyPassword')
            }
        }
        teste {
            if (testKeystore) {
                storeType 'PKCS12'
                storeFile file(testKeystore)
                storePassword testPassword
                keyAlias 'linvuu-test'
                keyPassword testPassword
            }
        }
    }
    packagingOptions {
        resources {
            // Resíduo de depuração das coroutines do Kotlin; não serve a nada no aparelho.
            excludes += ['DebugProbesKt.bin', '/META-INF/*.version', '/kotlin-tooling-metadata.json']
        }
    }
    buildTypes {
        debug {
            applicationIdSuffix '.teste'
            versionNameSuffix '-teste'
            resValue 'string', 'app_name', 'Linvuu Teste'
            if (testKeystore) signingConfig signingConfigs.teste
        }
        // Mesmo conjunto de otimizações da loja (R8), mas assinado com a chave de teste e com o sufixo .teste.
        // Serve para medir DEX e testar no aparelho sem desbloquear a tarefa de release.
        minificado {
            initWith debug
            debuggable false
            minifyEnabled true
            shrinkResources true
            matchingFallbacks = ['debug']
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (testKeystore) signingConfig signingConfigs.teste
        }
        // Loja: AAB com R8 ativo, com.linvuu.app, assinado pela chave de upload do dono (keystore.properties).
        release {
            debuggable false
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (producaoConfigurada) signingConfig signingConfigs.producao
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

// Release de loja só compila com a chave de upload configurada em keystore.properties (nunca com a chave de testes).
gradle.taskGraph.whenReady { graph ->
    if (graph.allTasks.any { it.project == project && it.name ==~ /(?i).*(assemble|bundle|package).*release.*/ } && !producaoConfigurada) {
        throw new GradleException('Release de loja bloqueada: crie android/keystore.properties a partir de keystore.properties.example (chave de upload do dono)')
    }
}
