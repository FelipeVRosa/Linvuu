name: Prévia da interface APK
on:
  pull_request:
    paths: ['src/**', 'scripts/revisar-apk.mjs', 'package*.json', 'vite.config.ts', '.github/workflows/revisao-apk.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  previa-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:apk
      - name: Instalar navegador apenas no runner
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1 @axe-core/playwright@4.14.0
          npx playwright install --with-deps chromium
      - name: Rever interface APK em três idiomas e duas larguras
        run: node scripts/revisar-apk.mjs
      - name: Rever redesign, acessibilidade automatizada e fonte ampliada
        run: node scripts/revisar-redesign-apk.mjs

      - name: Validar bloqueadores do parecer nos dois temas
        run: node scripts/testar-parecer-apk.mjs

      - name: Testar recuperação, controle e cancelamento de áudio
        run: node scripts/testar-audio-apk.mjs
      - name: Testar leitura, prática corrigida e retomada
        run: node scripts/testar-estudo-apk.mjs
