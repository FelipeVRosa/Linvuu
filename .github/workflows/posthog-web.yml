name: PostHog Web — consentimento e privacidade
on:
  pull_request:
    paths: ['src/lib/analytics.ts', 'src/components/AnalyticsConsent.tsx', 'src/components/analytics-consent.css', 'scripts/testar-analytics*', '.github/workflows/posthog-web.yml']
  push:
    branches: [main]
    paths: ['src/lib/analytics.ts', 'src/components/AnalyticsConsent.tsx', 'src/components/analytics-consent.css', '.github/workflows/posthog-web.yml']
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint && node --import tsx scripts/testar-analytics.ts
      - name: Compilar com token fictício, nunca enviar dados de visitantes
        env:
          VITE_POSTHOG_TOKEN: phc_fixture_not_a_real_token
          VITE_POSTHOG_HOST: https://us.i.posthog.com
          VITE_ANALYTICS_ENV: test
        run: npm run build
      - run: npm install --no-save --package-lock=false playwright@1.56.1 @axe-core/playwright@4.14.0 && npx playwright install --with-deps chromium
      - name: Testar web nos três idiomas, recusa e revogação
        env:
          ANALYTICS_TARGET: website
        run: node scripts/testar-analytics-browser.mjs
