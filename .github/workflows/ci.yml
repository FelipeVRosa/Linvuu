name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4 # o emulador do Firestore (testes de regras e da newsletter) exige Java
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/cache@v4 # evita baixar o emulador (~60 MB) a cada execução
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-firebase-tools-15.34.1
      - run: npm ci
      - name: Verificar tipos TypeScript
        run: npm run lint
      - name: Testar prontidao sem dependencias de producao
        run: node --import tsx scripts/testar-prontidao.ts
      - name: Testar notificações Stripe assinadas sem cobranças reais
        run: node --import tsx scripts/testar-billing-webhook.ts
      - name: Testar medição sem dados de produção
        run: npm run testar:medicao
      - name: Testar corretor e ditados reais
        run: node --import tsx scripts/testar-correcao-exercicios.ts
      - name: Testar isolamento do progresso
        run: npm run testar:progresso
      - name: Testar reenvio e isolamento do progresso na conta
        run: node --import tsx scripts/testar-sincronizacao-progresso.ts
      - name: Testar validação da newsletter (tipos, tamanhos, aceite, campos extras)
        run: npm run testar:newsletter
      - name: Testar a rota da newsletter no emulador do Firestore (consentimento, repetição, limite por IP)
        run: npm run testar:newsletter:rota
      - name: Testar as regras do Firestore no emulador (duas contas fictícias e visitante)
        run: npm run testar:regras
      - run: npm run build
      - name: Testar politica publica de indexacao
        run: node --import tsx scripts/testar-seo-publico.ts
      - name: Verificar todas as sessoes e idiomas, canonical e destinos publicos
        run: |
          node --import tsx scripts/testar-inventario-seo.ts
          node --import tsx scripts/testar-robots-navegacao.ts
          node --import tsx scripts/testar-http-seo.ts
          node --import tsx scripts/testar-links-publicos.ts
      - name: Sistema de design (contraste nos dois temas, só var() nos módulos, CSS dentro do limite)
        run: npm run validar:design
      - name: Dependências sem vulnerabilidade conhecida (produção)
        run: |
          for i in 1 2 3; do npm audit --omit=dev --audit-level=high && exit 0; echo "tentativa $i falhou"; sleep 20; done; exit 1
      - name: Teste de segurança do servidor (cabeçalhos, API fechada, limite de uso)
        run: npm run testar:seguranca
