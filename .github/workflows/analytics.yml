name: Privacidade e integração PostHog
on:
  pull_request:
    paths: ['src/lib/analytics.ts', 'src/lib/metaPixel.ts', 'src/components/AnalyticsConsent.tsx', 'src/components/analytics-consent.css', 'src/lib/medicao.ts', 'src/lib/progresso.ts', 'scripts/testar-analytics*', 'scripts/testar-meta-pixel*', '.github/workflows/analytics.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  analytics:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node --import tsx scripts/testar-analytics.ts
      - name: Compilar somente com configuração fictícia
        env:
          VITE_POSTHOG_TOKEN: phc_fixture_not_a_real_token
          VITE_POSTHOG_HOST: https://us.i.posthog.com
          VITE_ANALYTICS_ENV: test
        run: npm run build:website && npm run build:apk
      - name: Preparar navegador de teste
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1 @axe-core/playwright@4.14.0
          npx playwright install --with-deps chromium
      - name: Consentimento, recusa, revogação e acessibilidade nos três idiomas
        run: node scripts/testar-analytics-browser.mjs
      - name: Consentimento do pixel da Meta nos três idiomas sem enviar dados
        run: node scripts/testar-meta-pixel-browser.mjs
      - name: Confirmar ingestão com um único evento técnico identificado como teste
        if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'gpt/website-apk'
        env:
          VITE_POSTHOG_TOKEN: ${{ vars.VITE_POSTHOG_TOKEN }}
          VITE_POSTHOG_HOST: ${{ vars.VITE_POSTHOG_HOST }}
        run: |
          node --input-type=module - <<'JS'
          if(!process.env.VITE_POSTHOG_TOKEN)throw Error('Token público de coleta não configurado');
          const host=process.env.VITE_POSTHOG_HOST;
          if(!['https://us.i.posthog.com','https://eu.i.posthog.com'].includes(host))throw Error('Host inválido');
          const r=await fetch(host+'/i/v0/e/',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({api_key:process.env.VITE_POSTHOG_TOKEN,distinct_id:'ci:'+process.env.GITHUB_RUN_ID,event:'integration_verified',properties:{environment:'test',platform:'ci',source:process.env.GITHUB_SHA,$process_person_profile:false,$geoip_disable:true}}),signal:AbortSignal.timeout(10000)});
          if(!r.ok)throw Error('Ingestão falhou: HTTP '+r.status);
          console.log('Evento integration_verified aceito; environment=test, platform=ci. Não é tráfego de alunos.');
          JS
