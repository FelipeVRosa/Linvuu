name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verificar tipos TypeScript
        run: npm run lint && npm run lint:apk
      - name: Testar consentimento e minimização PostHog sem enviar dados
        run: node --import tsx scripts/testar-analytics.ts
      - name: Testar medição sem dados de produção
        run: npm run testar:medicao
      - name: Testar corretor e ditados reais
        run: node --import tsx scripts/testar-correcao-exercicios.ts
      - name: Testar isolamento do progresso
        run: npm run testar:progresso
      - name: Testar reenvio e isolamento do progresso na conta
        run: node --import tsx scripts/testar-sincronizacao-progresso.ts
      - name: Testar recuperação nativa simulada e tentativas versionadas do APK
        run: |
          node --import tsx scripts/testar-armazenamento-apk.ts
          node --import tsx scripts/testar-falha-inicial-armazenamento-apk.ts
          node --import tsx scripts/testar-tentativas-apk.ts
          node --import tsx scripts/testar-revisao-erros-apk.ts
      - run: npm run build:website
      - run: npm run build:apk
      - run: npm run testar:plataformas
      - name: Sistema de design (contraste nos dois temas, só var() nos módulos, CSS dentro do limite)
        run: npm run validar:design
      - name: Dependências sem vulnerabilidade conhecida (produção)
        run: |
          for i in 1 2 3; do npm audit --omit=dev --audit-level=high && exit 0; echo "tentativa $i falhou"; sleep 20; done; exit 1
      - name: Teste de segurança do servidor (cabeçalhos, API fechada, limite de uso)
        run: npm run testar:seguranca

