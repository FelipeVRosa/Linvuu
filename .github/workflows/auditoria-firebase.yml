name: Auditoria Firebase (somente leitura)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: auditoria-firebase
  cancel-in-progress: false
jobs:
  auditar:
    if: github.repository_id == '1400441159' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Exigir repositório privado antes da autenticação
        env:
          REPOSITORIO_PRIVADO: ${{ github.event.repository.private }}
        run: |
          if [ "$REPOSITORIO_PRIVADO" != "true" ]; then
            echo "::error::A auditoria detalhada exige repositório privado. Nenhuma coleta Google foi iniciada."
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: linvuu
          workload_identity_provider: projects/982052790317/locations/global/workloadIdentityPools/linvuu-auditoria/providers/github-main
          service_account: auditoria-github@linvuu.iam.gserviceaccount.com
          create_credentials_file: true
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
      - name: Coletar configuração e comparar regras
        run: python3 scripts/auditoria_firebase/coletar.py --out auditoria-firebase
      - name: Guardar somente os resultados da auditoria
        if: always() && github.event.repository.private == true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: auditoria-firebase-${{ github.run_id }}
          path: auditoria-firebase/
          if-no-files-found: warn
          retention-days: 3
