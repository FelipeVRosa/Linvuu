name: App Android (APK de teste)
on:
  workflow_dispatch:
  pull_request:
    paths: ['android/**', 'src/**', 'content/**', 'public/**', 'scripts/**', 'package*.json', 'vite.config.ts', 'capacitor.config.ts', '.github/workflows/app-android.yml', 'design/apk/teste-certificado-sha256.txt']
permissions:
  contents: read
jobs:
  apk:
    # Segredos e rascunhos somente na branch própria autorizada; nunca em forks.
    if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/gpt/website-apk') || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'gpt/website-apk')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # apenas para entregar APK em Release em rascunho
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - name: Identificar versão e commit do APK
        shell: bash
        run: |
          source_sha="$(git rev-parse HEAD)"
          echo "LINVUU_SOURCE_SHA=$source_sha" >> "$GITHUB_ENV"
          echo "ANDROID_VERSION_CODE=$((100000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "ANDROID_VERSION_NAME=0.1.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          echo "VITE_APK_BUILD_ID=0.1.$GITHUB_RUN_NUMBER ${source_sha:0:7}" >> "$GITHUB_ENV"
      - name: Preparar assinatura estável de testes sem imprimir segredos
        env:
          SIGNING_B64: ${{ secrets.ANDROID_TEST_KEYSTORE_B64 }}
        run: |
          python3 - <<'PY'
          import os, base64
          from pathlib import Path
          raw = os.environ.get('SIGNING_B64', '')
          if not raw:
              raise SystemExit('Segredo de assinatura de testes não configurado')
          folder = Path(os.environ['RUNNER_TEMP']) / 'linvuu-assinatura'
          folder.mkdir(mode=0o700, exist_ok=True)
          target = folder / 'teste.p12'
          target.write_bytes(base64.b64decode(raw, validate=True))
          target.chmod(0o600)
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write('LINVUU_TEST_KEYSTORE=' + str(target) + '\n')
          PY
      - name: Verificar guardas da loja e recuperação
        run: node --import tsx scripts/testar-loja-apk.ts && node --import tsx scripts/testar-armazenamento-apk.ts && node --import tsx scripts/testar-falha-inicial-armazenamento-apk.ts && node scripts/testar-distribuicao-apk.mjs
      - name: Gerar frontend identificado e sincronizar Android
        run: npm run app:android
      - name: Compilar APK e AAB de testes com assinatura estável
        working-directory: android
        env:
          LINVUU_TEST_PASSWORD: ${{ secrets.ANDROID_TEST_STORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug bundleDebug --no-daemon
      - name: Conferir assinatura, versão, origem e pacote separado
        id: entrega
        run: node scripts/preparar-entrega-apk.mjs
      - name: Registrar versão resolvida da biblioteca de cobrança
        working-directory: android
        env:
          LINVUU_TEST_PASSWORD: ${{ secrets.ANDROID_TEST_STORE_PASSWORD }}
        run: ./gradlew :app:dependencyInsight --dependency billing --configuration debugRuntimeClasspath --no-daemon
      - uses: actions/upload-artifact@v4
        continue-on-error: true # a entrega em rascunho abaixo é a alternativa à cota de artifacts
        with:
          name: linvuu-teste-${{ env.ANDROID_VERSION_CODE }}
          path: ${{ steps.entrega.outputs.directory }}/*
          retention-days: 1
          if-no-files-found: error
      - name: Entregar APK em Release em rascunho, sem publicar
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ENTREGA: ${{ steps.entrega.outputs.directory }}
        run: |
          tag="linvuu-teste-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$tag" "$ENTREGA"/* --draft --prerelease --target "$LINVUU_SOURCE_SHA" --title "Linvuu Teste $ANDROID_VERSION_NAME ($ANDROID_VERSION_CODE)" --notes-file "$ENTREGA/LEIA-ME.txt"
          draft="$(gh release view "$tag" --json isDraft --jq .isDraft)"
          test "$draft" = true
          url="$(gh release view "$tag" --json url --jq .url)"
          echo "### APK de teste verificado" >> "$GITHUB_STEP_SUMMARY"
          echo "Rascunho privado para revisão: $url" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: $LINVUU_SOURCE_SHA; versão: $ANDROID_VERSION_CODE; pacote: com.linvuu.app.teste" >> "$GITHUB_STEP_SUMMARY"
      - name: Remover material privado do runner
        if: always()
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          (Path(os.environ['RUNNER_TEMP']) / 'linvuu-assinatura' / 'teste.p12').unlink(missing_ok=True)
          PY
